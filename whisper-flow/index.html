<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow — Voice to Text</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              flow: {
                bg: '#0b0a14',
                panel: '#14121f',
                border: '#241f36',
                violet: '#7c5cff',
                blue: '#4f9dff',
              }
            }
          }
        }
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
<style>
  @keyframes orb-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  @keyframes orb-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .orb-recording { animation: orb-pulse 1.4s ease-in-out infinite; }
  .orb-processing { animation: orb-spin 1.2s linear infinite; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a2440; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body class="bg-flow-bg text-slate-100">
    <div id="root">
        <div class="flex items-center justify-center h-screen">
            <p class="text-slate-500 animate-pulse">Starting Flow...</p>
        </div>
    </div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
